<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>CSS Aural Reference</title><link rel="stylesheet" href="style.css"></head><body class="reference-page"><h1>CSS Aural Reference</h1><p>Aural CSS was designed for speech-based presentation of documents.</p><table><tr><th>Feature</th><th>Description</th></tr><tr><td>volume</td><td>Controls the volume of speech.</td></tr><tr><td>voice-family</td><td>Specifies the voice family.</td></tr><tr><td>speak</td><td>Specifies whether content should be spoken.</td></tr><tr><td>pause</td><td>Controls pauses in speech.</td></tr></table></body></html>
